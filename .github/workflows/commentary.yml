name: Weekly commentary

on:
  schedule:
    # Mondays around 3am Sydney time (Sunday 16:13 UTC), early enough that GitHub's
    # delays still land it by morning. Scheduled runs skip if this week's edition exists.
    - cron: "13 16 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commentary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh standings
        run: python3 scripts/fetch_standings.py

      - name: Write commentary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_commentary.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly commentary"
            git pull --rebase
            git push
          fi
